name: CLA Assistant

# `pull_request_target` (not `pull_request`) is required so this action can comment on and label
# pull requests opened from forks, which run with read-only, no-secret permissions by default.
# This workflow only ever reads/writes `.github/cla-signatures.json` and posts a PR comment/label
# via the pinned `contributor-assistant/github-action` -- it never checks out or executes the
# contributor's own branch code, so it does not carry that trigger's usual "runs untrusted code
# with repo secrets" risk. See CLA.md / CONTRIBUTING.md for what signing does and does not grant.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          # Deliberately NOT `main`: main requires a reviewed PR to merge anything (see
          # CONTRIBUTING.md's "Review and merge policy"), and this bot must record a signature
          # the instant someone comments the sign phrase -- routing that through a PR would mean
          # every new contributor's first signature is blocked on a maintainer manually approving
          # a bot-generated bookkeeping commit, defeating the point of automating this at all.
          # `cla-signatures` is a deliberately unprotected, orphan branch the bot commits to
          # directly; it was pre-seeded once (`{"signedContributors":[]}`) because the default
          # GITHUB_TOKEN could not create a brand-new branch itself even with `contents: write`
          # (a known limitation of this action -- see its own issue tracker for the same report).
          branch: "cla-signatures"
          allowlist: kyuubyN
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before this can be reviewed, please sign the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            by commenting exactly: `I have read the CLA Document and I hereby sign the CLA`.
            Signing grants a license (per CLA.md) — it does not grant governance rights,
            maintainership or equity; see GOVERNANCE.md for how decisions are actually made.
