name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core package (editable) + test extras
        run: pip install -e ".[test]"

      - name: Install api/ surface dependencies
        run: pip install -r api/requirements.txt

      - name: Run core test suite
        run: python -m pytest tests/ -q

      - name: Run api/ transport test suite
        run: python -m pytest api/tests/ -q

  build:
    name: Build sdist/wheel (sanity check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Install the built wheel in a clean env and import-smoke-test it
        run: |
          python -m venv /tmp/horizon-wheel-check
          /tmp/horizon-wheel-check/bin/pip install dist/*.whl
          /tmp/horizon-wheel-check/bin/python -c "import horizon_memory; print(horizon_memory.__name__)"

      - uses: actions/upload-artifact@v4
        with:
          name: proofray-dist
          path: dist/
          retention-days: 14
