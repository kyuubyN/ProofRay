name: Publish Python package to PyPI

# Never runs on an ordinary push or PR. A published GitHub Release only
# publishes the Python package when it is explicitly tagged `python-v…`.
# Native-app releases use `proofray-app-v…`, so releasing a Linux AppImage
# cannot accidentally publish a differently-versioned package to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the current Python distribution to PyPI
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build sdist + wheel
    if: >-
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'python-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: proofray-dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: >-
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'python-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    needs: build
    runs-on: ubuntu-latest
    # Requires a one-time setup on pypi.org (Publishing > Trusted Publisher) pointing at this
    # repo/workflow -- see https://docs.pypi.org/trusted-publishers/. No stored API token needed;
    # `id-token: write` is what lets PyPI verify this run via OIDC instead.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proofray-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
