name: Publish to PyPI

# Never runs on an ordinary push or PR -- only a manually-triggered run, or a GitHub Release the
# maintainer explicitly publishes. This project is pre-1.0 alpha (see pyproject.toml's own
# version); nothing here fires on its own.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: proofray-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires a one-time setup on pypi.org (Publishing > Trusted Publisher) pointing at this
    # repo/workflow -- see https://docs.pypi.org/trusted-publishers/. No stored API token needed;
    # `id-token: write` is what lets PyPI verify this run via OIDC instead.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proofray-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
