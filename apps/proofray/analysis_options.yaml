include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "lib/storage/app_database.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    discarded_futures: error
    unused_import: error

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_final_locals: true
    unawaited_futures: true
