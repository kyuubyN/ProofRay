name: proofray_app
description: Local-first ProofRay memory application.
publish_to: none
version: 0.1.0-alpha.2+2

environment:
  sdk: ">=3.13.1 <3.14.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: 3.0.6
  drift: 2.34.3
  proofray_duckdb:
    path: packages/proofray_duckdb
  file_selector: 1.1.0
  flutter_secure_storage: 10.3.1
  flutter_timezone: 5.1.0
  path: 1.9.1
  path_provider: 2.1.5
  serious_python: 4.5.1
  sqlite3: 3.5.2

dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.3
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/ProofRay.jpeg

# package:sqlite3 downloads and verifies the platform binary by SHA-256. Use
# SQLCipher on every target; an unencrypted fallback is forbidden.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter_launcher_icons:
  android: true
  image_path: assets/ProofRay.jpeg
  min_sdk_android: 29
  windows:
    generate: true
    image_path: assets/ProofRay.jpeg
    icon_size: 256
